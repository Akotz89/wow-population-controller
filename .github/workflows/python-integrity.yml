name: Python source integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Python syntax
        run: python -m compileall -q lib scripts
      - name: Test offline ledger integrity
        run: python -m unittest discover -s tests -v
